name: CI/CD para EC2 pública e privada

on:
  push:
    branches:
      - master # O branch que acionará o deploy
  workflow_dispatch: # Permite execução manual do workflow
jobs: 
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout do repositório
      - name: BE - Checkout do Código
        uses: actions/checkout@v4

      # 2. Configurar JDK
      - name: BE - Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # ou a distribuição que preferir
          java-version: '21'
          cache: 'maven' # Configura cache do Maven para acelerar builds futuros
          cache-dependency-path: 'anjos-bolos-api/pom.xml' # Caminho correto para o pom.xml
      # 6. Configurar IP_PUBLICO no application.properties
      - name: BE - Configurar IP Público e Banco de Dados no application.properties
        run: |
          # Substitui CORS origins pelo IP do REMOTE_HOST na porta 80
          sed -i "s|^cors.allowed.origins=.*|cors.allowed.origins=http://${{ secrets.REMOTE_HOST }}:80|g" src/main/resources/application.properties
          sed -i "s|^spring.redis.host=.*|spring.redis.host=${{ secrets.REMOTE_HOST_PRIVADO }}|g" src/main/resources/application.properties
          
          echo "✅ IP_PUBLICO configurado para: http://${{ secrets.REMOTE_HOST }}:80"
          
          # Substitui URL do banco de dados para apontar para a EC2 privada
          sed -i "s|^spring.datasource.url=.*|spring.datasource.url=jdbc:mysql://${{ secrets.REMOTE_HOST_PRIVADO }}:3306/anjos_bolos?useSSL=false\&allowPublicKeyRetrieval=true|g" src/main/resources/application.properties
          
          echo "✅ Database URL configurado para: jdbc:mysql://${{ secrets.REMOTE_HOST_PRIVADO }}:3306/anjos_bolos"
          
          # Mostra as linhas modificadas para confirmar
          echo "Configurações aplicadas:"
          grep "cors.allowed.origins" src/main/resources/application.properties
          grep "spring.datasource.url" src/main/resources/application.properties
        working-directory: ./anjos-bolos-api

      # 7. Geração do .jar
      - name: BE - Gerar Artefato .JAR
        run: mvn package -DskipTests=true # -DskipTests=true pq os testes foram executados no passo anterior
        working-directory: ./anjos-bolos-api

      # 8. Dando o mesmo nome sempre ao .jar
      - name: BE - Renomear JAR para app_loko.jar # ou o nome que preferir parta o jar
        run: |
          # Encontra o primeiro (e único) arquivo .jar gerado na pasta 'target'
          # e o renomeia para o nome fixo.
          # O comando 'ls target/*.jar' retorna o nome original.
          
          JAR_NAME=$(ls target/*.jar)
          
          # Renomeia o arquivo.
          mv $JAR_NAME target/app_loko.jar
          
          echo "Renomeado para: target/app_loko.jar"
        working-directory: ./anjos-bolos-api

      # 8. Copiar JAR para EC2 pública via SCP
      - name: BE - Copiar JAR para EC2 pública
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./anjos-bolos-api/target/app_loko.jar"
          target: "/home/${{ secrets.REMOTE_USER }}/"
          strip_components: 3

            # 9. Transferir JAR da EC2 pública para privada e executar
      - name: BE - Transferir para EC2 privada e reiniciar aplicação
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }} 
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}  
          script: |
            set -e
            
            # Configurar PATH para a sessão
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            
            # Verificar se o arquivo foi copiado
            echo "Verificando arquivo copiado:"
            ls -lh /home/${{ secrets.REMOTE_USER }}/app_loko.jar
            
            # Usar chave SSH existente para acessar EC2 privada
            ARQUIVO_PEM="/home/${{ secrets.REMOTE_USER }}/anjos-bolos-low-cost-key.pem"
            echo "Usando chave SSH existente: $ARQUIVO_PEM"
            
            # Transferir JAR para EC2 privada
            USUARIO_IP="${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST_PRIVADO }}"
            echo "Transferindo para EC2 privada: $USUARIO_IP"
            
            # Garantir que o diretório existe na EC2 privada
            ssh -o StrictHostKeyChecking=no -i $ARQUIVO_PEM $USUARIO_IP \
              'export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" && /usr/bin/sudo mkdir -p /usr/share/api'
            
            # Copiar o JAR
            scp -o StrictHostKeyChecking=no -i $ARQUIVO_PEM \
              /home/${{ secrets.REMOTE_USER }}/app_loko.jar \
              $USUARIO_IP:/tmp/app_loko.jar
            
            # Mover para o diretório final com sudo e ajustar permissões
            ssh -o StrictHostKeyChecking=no -i $ARQUIVO_PEM $USUARIO_IP \
              'export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" && /usr/bin/sudo mv /tmp/app_loko.jar /usr/share/api/app_loko.jar && /usr/bin/sudo chmod 644 /usr/share/api/app_loko.jar'
            
            echo "Arquivo transferido com sucesso!"
            
            # Reiniciar aplicação via Docker Compose (força recriação)
            echo "Reiniciando aplicação..."
            ssh -o StrictHostKeyChecking=no -i $ARQUIVO_PEM $USUARIO_IP << 'ENDSSH'
              export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              cd /home/ubuntu
              echo "Parando containers..."
              /usr/bin/sudo /usr/local/bin/docker-compose -f compose-api.yaml down 2>/dev/null || true
              echo "Recriando e iniciando containers com novo JAR..."
              /usr/bin/sudo /usr/local/bin/docker-compose -f compose-api.yaml up -d --force-recreate
              echo "Aguardando inicialização..."
              sleep 5
              echo "Status dos containers:"
              /usr/bin/sudo /usr/local/bin/docker-compose -f compose-api.yaml ps
              echo "Containers recriados e iniciados!"
            ENDSSH
            
            echo "Aplicação reiniciada com sucesso!"
            
            # Limpar arquivos temporários na EC2 pública
            echo "Limpando arquivos temporários..."
            rm -f /home/${{ secrets.REMOTE_USER }}/app_loko.jar
            
            echo "Limpeza concluída!"
      # 10. Gerar JAR do Email Service
      - name: EMAIL - Gerar Artefato .JAR
        run: mvn package -DskipTests=true
        working-directory: ./anjos-bolos-api-email

      # 11. Renomear JAR do Email Service
      - name: EMAIL - Renomear JAR para email_service.jar
        run: |
          JAR_NAME=$(ls target/*.jar)
          mv $JAR_NAME target/email_service.jar
          echo "Renomeado para: target/email_service.jar"
        working-directory: ./anjos-bolos-api-email

      # 12. Copiar JAR do Email Service para EC2
      - name: EMAIL - Copiar JAR para EC2 pública
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./anjos-bolos-api-email/target/email_service.jar"
          target: "/home/${{ secrets.REMOTE_USER }}/"
          strip_components: 3

            # 13. Configurar e executar Email Service na EC2 privada
      - name: EMAIL - Configurar e executar Email Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            # Configurar PATH para a sessão
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            
            # Verificar arquivo do email service
            echo "Verificando arquivo email_service.jar:"
            ls -lh /home/${{ secrets.REMOTE_USER }}/email_service.jar
            
            # Configurar chave SSH
            ARQUIVO_PEM="/home/${{ secrets.REMOTE_USER }}/anjos-bolos-low-cost-key.pem"
            USUARIO_IP="${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST_PRIVADO }}"
            
            # Criar diretórios na EC2 privada (se não existirem)
            ssh -o StrictHostKeyChecking=no -i $ARQUIVO_PEM $USUARIO_IP \
              'export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" && /usr/bin/sudo mkdir -p /usr/share/api-email'
            
            # Transferir JAR do email service
            scp -o StrictHostKeyChecking=no -i $ARQUIVO_PEM \
              /home/${{ secrets.REMOTE_USER }}/email_service.jar \
              $USUARIO_IP:/tmp/email_service.jar
            
            # Criar arquivo .env dentro de /usr/share/api-email
            ssh -o StrictHostKeyChecking=no -i $ARQUIVO_PEM $USUARIO_IP \
              'export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" && \
              /usr/bin/sudo mkdir -p /usr/share/api-email && \
              /usr/bin/sudo rm -rf /usr/share/api-email/.env && \
              /usr/bin/sudo tee /usr/share/api-email/.env > /dev/null << "ENV_EOF"
            EMAIL_SECRET="${{ secrets.EMAIL_SECRET }}"
            BACKUP_EMAIL_SECRET="${{ secrets.BACKUP_EMAIL_SECRET }}"
            ENV_EOF
            /usr/bin/sudo chmod 640 /usr/share/api-email/.env && \
            /usr/bin/sudo chown ubuntu:ubuntu /usr/share/api-email/.env && \
            /usr/bin/sudo ls -l /usr/share/api-email/.env && \
            /usr/bin/sudo file /usr/share/api-email/.env'
            
            # Mover JAR para o diretório final
            ssh -o StrictHostKeyChecking=no -i $ARQUIVO_PEM $USUARIO_IP \
              'export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" && /usr/bin/sudo mv /tmp/email_service.jar /usr/share/api-email/email_service.jar && /usr/bin/sudo chmod 644 /usr/share/api-email/email_service.jar'
            
            # Criar compose-rabbit.yaml e iniciar APENAS o Email Service + RabbitMQ
            ssh -o StrictHostKeyChecking=no -i $ARQUIVO_PEM $USUARIO_IP << 'ENDSSH'
              export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              cd /home/ubuntu
              
              # Verificar se o .env ao lado do JAR é um arquivo (não diretório)
              if [ -f "/usr/share/api-email/.env" ]; then
                echo "✅ /usr/share/api-email/.env é um arquivo válido"
                ls -la /usr/share/api-email/.env
              else
                echo "❌ Erro: /usr/share/api-email/.env não é um arquivo válido"
                ls -la /usr/share/api-email/.env 2>/dev/null || echo "Arquivo não existe"
                exit 1
              fi
              
              # Resto do código permanece igual...
              echo "Criando compose-rabbit.yaml..."
              # [mantenha o resto do código como está]
              
              echo "Parando containers do email service se estiverem rodando..."
              /usr/bin/sudo /usr/local/bin/docker-compose -f compose-rabbit.yaml down 2>/dev/null || true
              echo "Iniciando APENAS Email Service + RabbitMQ..."
              /usr/bin/sudo /usr/local/bin/docker-compose -f compose-rabbit.yaml up -d --force-recreate
              echo "Aguardando inicialização..."
              sleep 15
              echo "Status dos containers do Email Service:"
              /usr/bin/sudo /usr/local/bin/docker-compose -f compose-rabbit.yaml ps
              echo "Email Service + RabbitMQ iniciados!"
            ENDSSH
            
            echo "Email Service configurado e iniciado com sucesso!"
            
            # Limpar arquivos temporários
            echo "Limpando arquivos temporários do email service..."
            rm -f /home/${{ secrets.REMOTE_USER }}/email_service.jar
            
            echo "Limpeza do email service concluída!"
