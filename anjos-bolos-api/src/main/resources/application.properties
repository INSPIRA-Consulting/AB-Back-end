spring.application.name=anjos-bolos-api
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always
server.error.include-binding-errors=always

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:banco
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

springdoc.swagger-ui.custom-css-url=/static/swagger-theme.css
spring.web.resources.static-locations=classpath:/static/

spring.datasource.username=admin
spring.datasource.password=admin

# JWT
jwt.secret=MinhaChaveSecreta123!@#
jwt.expiration=86400000
jwt.validity=86400000
jwt.issuer=anjos-bolos-api

#mvn spring-boot:run -Dspring-boot.run.profiles=dev -Ddebug

#---------------------------Swagger----------------------------------------#
springdoc.api-docs.path=/api-docs
springdoc.api-docs.version=openapi_3_1
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
server.forward-headers-strategy=framework

springdoc.swagger-ui.oauth.client-id=your-client-id
springdoc.swagger-ui.oauth.scopes=openid,profile,email
springdoc.cache.disabled=true




