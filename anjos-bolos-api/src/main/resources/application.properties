spring.application.name=anjos-bolos-api

# --- Configuração JPA -------------------------------------------------------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.error.include-message=always
server.error.include-binding-errors=always

# --- Configuração H2 Database -----------------------------------------------------------------------------------------
#spring.h2.console.enabled=true
#spring.datasource.url=jdbc:h2:mem:banco
#spring.h2.console.path=/h2-console
#spring.h2.console.settings.trace=false
#spring.h2.console.settings.web-allow-others=false

# --- Configuração MySQL -----------------------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/anjos_bolos?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=anjos_bolos_api
spring.datasource.password=@nj0sB0l0s
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configuração Swagger ---------------------------------------------------------------------------------------------
springdoc.swagger-ui.custom-css-url=/static/swagger-theme.css
spring.web.resources.static-locations=classpath:/static/

springdoc.api-docs.enabled=true
springdoc.api-docs.version=openapi_3_1
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
server.forward-headers-strategy=framework

springdoc.swagger-ui.oauth.client-id=your-client-id
springdoc.swagger-ui.oauth.scopes=openid,profile,email
springdoc.cache.disabled=true

#spring.datasource.username=admin
#spring.datasource.password=admin

# --- Configuração Token JWT -------------------------------------------------------------------------------------------
#jwt.issuer=anjos-bolos-api

# Tempo de Expiração do Token em Milisegundos (3600000 = 1 hora)
jwt.validity=3600000

# Palavra-Passe do Token (segredo)
# Mínimo de 32 caracteres. Sua função é assinar e verificar os tokens.
# Recomendável  usar uma Chave complexa e difícil de adivinhar para garantir a Segurança da Aplicação
jwt.

spring.main.allow-circular-references=true

#./mvnw spring-boot:run -Dspring-boot.run.arguments="--debug"

# --- Configuracao AWS S3 ----------------------------------------------------------------------------------------------
aws.region=us-east-1
aws.s3.bucket-name=bucket-raw-anjos-bolos-1

# --- Congiguracao ------------------------------------------------------------------------------------------------
# IP publico para CORS (exemplo: http://52.23.123.45:5173)
cors.allowed.origins=${IP_PUBLICO:http://localhost:5173}
